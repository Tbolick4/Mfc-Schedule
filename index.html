<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Schedule Generator</title>
<style>
  :root{
    --off:#ffffff;
    --amfront:#f6c6ce;
    --amback:#f2a765;
    --pmfront:#aad38c;
    --pmback:#9dcbe8;
    --mixed:#dfb8e0;
    --double:#ffe36e;
    --other:#d9d9d9;
    --ink:#1c1c1c;
    --line:#333;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    margin:0;
    padding:12px;
    background:#f4f4f2;
    color:var(--ink);
    font-size:14px;
  }
  h1{font-size:18px;margin:0 0 10px 0;}
  .toolbar{
    display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;
  }
  .toolbar-group{margin-bottom:6px;border:1px solid #ddd;border-radius:6px;padding:2px 8px;background:#fff;}
  .toolbar-label{
    font-size:12px;font-weight:bold;letter-spacing:0.02em;
    color:#333;padding:8px 2px;cursor:pointer;list-style:none;
  }
  .toolbar-label::-webkit-details-marker{display:none;}
  .toolbar-label::before{content:'▸ ';color:#888;}
  details[open] > .toolbar-label::before{content:'▾ ';}
  .toolbar-group .toolbar{margin-bottom:8px;}
  button{
    border:1px solid #999;background:#fff;border-radius:6px;
    padding:7px 10px;font-size:13px;cursor:pointer;
  }
  button:active{background:#eee;}
  button.primary{background:#2b6cb0;color:#fff;border-color:#2b6cb0;}
  button.danger{background:#b03030;color:#fff;border-color:#b03030;}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;}
  label{font-size:12px;color:#444;}
  input[type=text],input[type=date]{
    padding:5px 6px;border:1px solid #aaa;border-radius:4px;font-size:13px;
  }
  #status{font-size:12px;color:#666;min-height:16px;}

  .legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .swatch{
    display:flex;align-items:center;gap:5px;border:1px solid #888;border-radius:5px;
    padding:3px 7px;font-size:11px;background:#fff;
  }
  .swatch .box{width:14px;height:14px;border:1px solid #666;border-radius:3px;flex:none;}

  .tablewrap{overflow-x:auto;border:1px solid #444;border-radius:6px;background:#fff;}
  table{border-collapse:collapse;width:100%;min-width:720px;}
  th,td{border:1px solid #666;padding:3px;text-align:center;vertical-align:middle;}
  th{background:#eee;font-size:12px;padding:6px 3px;}
  td.namecell{
    font-weight:bold;text-align:left;padding-left:8px;white-space:nowrap;font-size:13px;
    min-width:100px;
  }
  td.totalcell{
    font-weight:bold;text-align:center;background:#f0f0ec;min-width:64px;font-size:13px;
  }
  tr.group-divider td{
    background:#ffe36e;height:6px;padding:0;border-left:none;border-right:none;
  }
  tr.group-label td{
    background:#ddd;font-weight:bold;text-align:left;padding-left:8px;font-size:11px;
    color:#333;
  }
  .cell{padding:2px;min-width:88px;position:relative;}
  .celltoggles{display:flex;justify-content:space-between;margin-bottom:2px;}
  .celltoggles button{
    padding:0 4px;font-size:11px;line-height:16px;border:1px solid #999;border-radius:3px;background:#fff;
  }
  .celltoggles button.on{background:#333;color:#fff;border-color:#333;}
  .cell.locked{outline:2px solid #444;}
  .cell.needsfill{outline:2px dashed #c0392b;}
  .cell.blocked-day{background:repeating-linear-gradient(45deg, #f0f0f0, #f0f0f0 5px, #fafafa 5px, #fafafa 10px);}
  select.shift-select:disabled, input.shift-time:disabled{opacity:.65;}

  #generatePanel{
    background:#fff;border:2px solid #444;border-radius:8px;padding:12px;margin-bottom:10px;
  }
  #generatePanel h3{margin:0 0 8px 0;font-size:14px;}
  #generatePanel summary{cursor:pointer;font-weight:bold;font-size:13px;padding:6px 0;}
  #generatePanel details{margin-top:4px;border-top:1px solid #eee;}
  #generatePanel ul{margin:0;padding-left:18px;font-size:13px;}
  #generatePanel li{margin-bottom:4px;}
  select.shift-select{
    width:100%;font-size:11px;padding:2px;border:1px solid #777;border-radius:4px;margin-bottom:2px;
  }
  input.shift-time{
    width:100%;font-size:12px;padding:2px;border:1px solid #999;border-radius:4px;text-align:center;
  }
  .rowbtns{display:flex;gap:2px;}
  .rowbtns button{padding:2px 5px;font-size:11px;}

  .roster-editor,.legend-editor{
    background:#fff;border:1px solid #999;border-radius:6px;padding:10px;margin-bottom:10px;
  }
  .roster-editor h3,.legend-editor h3{margin:0 0 8px 0;font-size:14px;}
  .group-block{border:1px dashed #aaa;border-radius:6px;padding:6px;margin-bottom:8px;}
  .emp-line{display:flex;gap:6px;align-items:center;margin-bottom:4px;}
  .emp-line input[type=text]{flex:1;}

  .legend-line{display:flex;gap:6px;align-items:center;margin-bottom:4px;}
  .legend-line input[type=color]{width:34px;height:28px;padding:0;border:1px solid #999;}
  .legend-line input[type=text]{flex:1;}

  .hidden{display:none !important;}

  #cloudSetup, #loginBar{
    background:#fff8e1;border:1px solid #d4b106;border-radius:6px;padding:10px;margin-bottom:10px;font-size:13px;
  }
  #cloudSetup input{width:100%;margin-bottom:6px;}
  #loginBar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#eef2f7;border-color:#888;}
  #syncDot{width:9px;height:9px;border-radius:50%;background:#aaa;display:inline-block;}
  #syncDot.live{background:#2e9e44;}

  @media print{
    body{background:#fff;padding:0;font-size:11px;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;}
    .toolbar,.roster-editor,.legend-editor,#status,.no-print,#loginBar,#cloudSetup,.legend,#generatePanel{display:none !important;}
    .tablewrap{border:none;}
    select.shift-select{border:none;pointer-events:none;-webkit-appearance:none;appearance:none;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;}
    input.shift-time{border:none;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;}
    .celltoggles{display:none !important;}
    table{min-width:0;}
  }
</style>
</head>
<body>

<h1 id="pageTitle">Weekly Schedule Generator</h1>

<div id="cloudSetup" class="hidden">
  <strong>One-time cloud setup</strong> — paste your Supabase project details so this schedule can be shared live.
  <input type="text" id="cfgUrl" placeholder="Supabase Project URL (https://xxxx.supabase.co)">
  <input type="text" id="cfgKey" placeholder="Supabase anon public API key">
  <button class="primary" id="btnSaveCloudCfg">Save & connect</button>
  <button id="btnSkipCloud">Skip — keep this browser-only for now</button>
</div>

<div id="loginBar" class="hidden">
  <span id="syncDot"></span>
  <span id="syncLabel">Not connected</span>
  <span style="flex:1;"></span>
  <span id="viewerControls">
    <button id="btnAdminLogin">Admin log in</button>
  </span>
  <span id="adminControls" class="hidden">
    <strong style="color:#2e9e44;">Editing as admin</strong>
    <button id="btnAdminLogout">Log out</button>
  </span>
</div>

<div class="row no-print">
  <label>Week label:</label>
  <input type="text" id="weekLabel" placeholder="e.g. Aug 3-8" style="width:140px;">
  <label>Week start date:</label>
  <input type="date" id="weekStart">
  <label><input type="checkbox" id="includeSunday"> include Sunday</label>
</div>

<div class="toolbar no-print" id="editToolbar">
  <button class="primary" id="btnGenerate">Generate</button>
  <button id="btnPrint">Print / Export</button>
</div>

<details class="toolbar-group no-print" id="editToolbar-schedule">
  <summary class="toolbar-label">Schedule</summary>
  <div class="toolbar">
    <button id="btnNewWeek">New blank week</button>
    <button id="btnDuplicate">Duplicate last saved week</button>
    <button id="btnSave">Save this week</button>
    <button id="btnLoad">Load a saved week</button>
  </div>
</details>

<details class="toolbar-group no-print" id="editToolbar-roster">
  <summary class="toolbar-label">Roster &amp; Rules</summary>
  <div class="toolbar">
    <button id="btnToggleRoster">Edit roster</button>
    <button id="btnToggleLegend">Edit shift types</button>
    <button id="btnToggleReq">Edit staffing needs</button>
    <button class="danger" id="btnResetRoster">Reset roster to default</button>
    <button class="danger" id="btnResetReq">Reset staffing needs to 0</button>
    <button id="btnSaveRosterTemplate">Save roster as template</button>
    <button id="btnLoadRosterTemplate">Load saved template</button>
  </div>
</details>

<details class="toolbar-group no-print" id="editToolbar-sharing">
  <summary class="toolbar-label">Sharing</summary>
  <div class="toolbar">
    <button id="btnOpenCloudSetup">Set up live sharing</button>
    <button id="btnTextGroup">Text schedule to group</button>
    <button id="btnSaveToFile">Save all data to file</button>
    <button id="btnLoadFromFile">Load all data from file</button>
  </div>
</details>

<input type="file" id="fileImportInput" accept=".json" class="hidden">
<div class="toolbar no-print" id="viewerToolbar">
  <button id="btnPrintViewer">Print / Export</button>
</div>
<div id="status">Loading...</div>

<div class="legend" id="legendBar"></div>

<div class="roster-editor hidden" id="rosterEditor"></div>
<div class="legend-editor hidden" id="legendEditor"></div>
<div class="roster-editor hidden" id="reqEditor"></div>

<div id="generatePanel" class="hidden"></div>

<div class="tablewrap">
  <table id="schedTable"></table>
</div>

<script>
const STORE_PREFIX = 'mfcsched';
const DAY_NAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

const DEFAULT_LEGEND = [
  {key:'OFF',   label:'OFF',       color:'#ffffff', period:'either', area:'either', defaultTime:''},
  {key:'AMF',   label:'AM FRONT',  color:'#f6c6ce', period:'day',    area:'front',  defaultTime:'9:00/3:00'},
  {key:'AMB',   label:'AM BACK',   color:'#f2a765', period:'day',    area:'back',   defaultTime:'9:00/3:00'},
  {key:'PMF',   label:'PM FRONT',  color:'#aad38c', period:'night',  area:'front',  defaultTime:'3:00/8:30'},
  {key:'PMB',   label:'PM BACK',   color:'#9dcbe8', period:'night',  area:'back',   defaultTime:'3:00/8:30'},
  {key:'MIX',   label:'MIXED HRS', color:'#dfb8e0', period:'either', area:'either', defaultTime:'10:30/8:30'},
  {key:'DBL',   label:'DOUBLE',    color:'#ffe36e', period:'either', area:'either', defaultTime:'9:00/8:30'},
  {key:'OTH',   label:'OTHER',     color:'#d9d9d9', period:'either', area:'either', defaultTime:''},
];

const DEFAULT_ROSTER = [
  {name:'Front Counter', employees:['NITA','RITA','SIDNEY','CLARA','TYLER','BURGUNDY','SHELBY','ASHLEY']},
  {name:'Shift Leads',   employees:['ALEX','KHRYSTAL']},
  {name:'Kitchen',       employees:['RICK','BRONSON','THOMAS','KALEB','JEFF','CRAIG']},
];

const DEFAULT_REQUIREMENTS = {
  'Front Counter': {day:0, night:0},
  'Shift Leads':   {day:0, night:0},
  'Kitchen':       {day:0, night:0},
};

let roster = null;      // [{name, employees:[{id,name}]}]
let legend = null;      // [{key,label,color}]
let requirements = {};  // { groupName: numberNeededPerDay }
let cells = {};         // { "empId:dayIdx": {type, time} }
let numDays = 6;
let uidCounter = 1;
let sb = null;           // Supabase client, once configured
let isAdmin = false;
let cloudConfigured = false;
const CFG_URL_KEY = 'mfcsched_cloud_url';
const CFG_KEY_KEY = 'mfcsched_cloud_key';

function setStatus(msg){ document.getElementById('status').textContent = msg || ''; }

function newEmpId(){ return 'e' + (uidCounter++) + '_' + Math.random().toString(36).slice(2,7); }

function normalizeRosterFromNames(defaultGroups){
  return defaultGroups.map(g => ({
    name: g.name,
    employees: g.employees.map(n => ({id:newEmpId(), name:n, pref:'either', areaPref:'either', blockedDays:[], recurringShifts:{}, hourTarget:null, preferredDayOff:null}))
  }));
}

function hasClaudeStorage(){
  return typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}

function lsGet(key){
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
function lsSet(key, value){
  try{ localStorage.setItem(key, value); return true; }catch(e){ return false; }
}
function lsRemove(key){
  try{ localStorage.removeItem(key); }catch(e){ /* ignore */ }
}

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timed out after ' + ms + 'ms')), ms))
  ]);
}

async function storageGetJSON(key){
  if(cloudConfigured && sb){
    try{
      const { data, error } = await withTimeout(sb.from('app_state').select('value').eq('key', key).maybeSingle(), 4000);
      if(error) throw error;
      return data ? data.value : null;
    }catch(e){ console.warn('cloud get unavailable, using fallback', e); return null; }
  }
  if(hasClaudeStorage()){
    try{
      const res = await withTimeout(window.storage.get(key, false), 4000);
      return res ? JSON.parse(res.value) : null;
    }catch(e){ console.warn('claude storage get unavailable, using fallback', e); }
  }
  try{
    const raw = lsGet(key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    return null;
  }
}
async function storageSetJSON(key, obj){
  if(cloudConfigured && sb){
    try{
      const { error } = await withTimeout(sb.from('app_state').upsert({ key, value: obj, updated_at: new Date().toISOString() }), 4000);
      if(error) throw error;
      return true;
    }catch(e){ console.warn('cloud save unavailable, using fallback', e); return false; }
  }
  if(hasClaudeStorage()){
    try{
      const res = await withTimeout(window.storage.set(key, JSON.stringify(obj), false), 4000);
      if(res) return true;
    }catch(e){ console.warn('claude storage set unavailable, using fallback', e); }
  }
  try{
    lsSet(key, JSON.stringify(obj));
    return true;
  }catch(e){
    return false;
  }
}

let localFileHandle = null;

function supportsFileSystemAccess(){
  return typeof window !== 'undefined' && !!window.showSaveFilePicker && !!window.showOpenFilePicker;
}

async function gatherAllAppData(){
  const roster_ = await storageGetJSON(STORE_PREFIX + ':roster');
  const legend_ = await storageGetJSON(STORE_PREFIX + ':legend');
  const req_ = await storageGetJSON(STORE_PREFIX + ':requirements');
  const weeklist_ = (await storageGetJSON(STORE_PREFIX + ':weeklist')) || [];
  const weeks_ = {};
  for(const k of weeklist_){
    weeks_[k] = await storageGetJSON(k);
  }
  return { roster: roster_, legend: legend_, requirements: req_, weeklist: weeklist_, weeks: weeks_, savedAt: new Date().toISOString() };
}

async function restoreAllAppData(data){
  if(data.roster) await storageSetJSON(STORE_PREFIX + ':roster', data.roster);
  if(data.legend) await storageSetJSON(STORE_PREFIX + ':legend', data.legend);
  if(data.requirements) await storageSetJSON(STORE_PREFIX + ':requirements', data.requirements);
  if(data.weeklist) await storageSetJSON(STORE_PREFIX + ':weeklist', data.weeklist);
  if(data.weeks){
    for(const k of Object.keys(data.weeks)){
      await storageSetJSON(k, data.weeks[k]);
    }
  }
}

async function saveAllToLocalFile(){
  const data = await gatherAllAppData();
  const text = JSON.stringify(data, null, 2);

  if(supportsFileSystemAccess()){
    try{
      if(!localFileHandle){
        localFileHandle = await window.showSaveFilePicker({
          suggestedName: 'schedule-data.json',
          types: [{ description: 'JSON', accept: {'application/json': ['.json']} }]
        });
      }
      const writable = await localFileHandle.createWritable();
      await writable.write(text);
      await writable.close();
      setStatus('Saved to ' + (localFileHandle.name || 'local file') + '.');
      return;
    }catch(e){
      if(e.name === 'AbortError') return;
      console.error('save to file failed', e);
      setStatus('Could not save to file: ' + e.message);
      return;
    }
  }

  try{
    const blob = new Blob([text], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'schedule-data.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    setStatus('Downloaded schedule-data.json — keep it somewhere you\'ll remember to load it again later.');
  }catch(e){
    console.error('download fallback failed', e);
    setStatus('Could not save a file in this browser: ' + e.message);
  }
}

async function loadAllFromLocalFile(){
  if(supportsFileSystemAccess()){
    try{
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: 'JSON', accept: {'application/json': ['.json']} }]
      });
      localFileHandle = handle;
      const file = await handle.getFile();
      const text = await file.text();
      const data = JSON.parse(text);
      await restoreAllAppData(data);
      await loadRosterAndLegend();
      renderLegendBar();
      renderTable();
      setStatus('Loaded data from ' + handle.name + '.');
      return;
    }catch(e){
      if(e.name === 'AbortError') return;
      console.error('load from file failed', e);
      setStatus('Could not load that file: ' + e.message);
      return;
    }
  }
  document.getElementById('fileImportInput').click();
}

function loadSupabaseLib(){
  return new Promise((resolve, reject) => {
    if(window.supabase && window.supabase.createClient){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Could not load the Supabase library — check your internet connection.'));
    document.head.appendChild(s);
    setTimeout(() => reject(new Error('Timed out loading the Supabase library.')), 8000);
  });
}

async function setupCloudClient(url, key){
  try{
    await loadSupabaseLib();
    sb = window.supabase.createClient(url, key);
    cloudConfigured = true;
    return true;
  }catch(e){
    console.error('Supabase client init failed', e);
    cloudConfigured = false;
    sb = null;
    return false;
  }
}

async function initCloud(){
  const savedUrl = lsGet(CFG_URL_KEY);
  const savedKey = lsGet(CFG_KEY_KEY);
  if(savedUrl && savedKey){
    await setupCloudClient(savedUrl, savedKey);
  }
  updateSyncStatus();

  if(cloudConfigured){
    try{
      const { data: { session } } = await sb.auth.getSession();
      isAdmin = !!session;
    }catch(e){ isAdmin = false; }
  } else {
    isAdmin = true; // no cloud configured yet — treat this browser as the editor, same as before
  }
  applyAdminUI();

  if(cloudConfigured){
    sb.channel('app_state_changes')
      .on('postgres_changes', { event:'*', schema:'public', table:'app_state' }, async () => {
        await loadRosterAndLegend();
        renderLegendBar();
        const key = await currentWeekKey();
        const data = await storageGetJSON(key);
        if(data){ cells = data.cells || {}; }
        renderTable();
        updateSyncStatus();
      })
      .subscribe();

    sb.auth.onAuthStateChange((_event, session) => {
      isAdmin = !!session;
      applyAdminUI();
    });
  }
}

function updateSyncStatus(){
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  const bar = document.getElementById('loginBar');
  const setup = document.getElementById('cloudSetup');
  if(cloudConfigured){
    bar.classList.remove('hidden');
    setup.classList.add('hidden');
    dot.classList.add('live');
    label.textContent = 'Connected — live shared schedule';
  } else {
    bar.classList.add('hidden');
    dot.classList.remove('live');
    label.textContent = 'Not connected';
  }
}

function applyAdminUI(){
  const editSections = [
    document.getElementById('editToolbar'),
    document.getElementById('editToolbar-schedule'),
    document.getElementById('editToolbar-roster'),
    document.getElementById('editToolbar-sharing'),
  ];
  const viewerToolbar = document.getElementById('viewerToolbar');
  const viewerControls = document.getElementById('viewerControls');
  const adminControls = document.getElementById('adminControls');

  if(!cloudConfigured){
    // browser-only mode, same as before: full editor, no login gate
    editSections.forEach(el => el.classList.remove('hidden'));
    viewerToolbar.classList.add('hidden');
    document.getElementById('loginBar').classList.add('hidden');
    isAdmin = true;
    return;
  }

  if(isAdmin){
    editSections.forEach(el => el.classList.remove('hidden'));
    viewerToolbar.classList.add('hidden');
    viewerControls.classList.add('hidden');
    adminControls.classList.remove('hidden');
  } else {
    editSections.forEach(el => el.classList.add('hidden'));
    viewerToolbar.classList.remove('hidden');
    viewerControls.classList.remove('hidden');
    adminControls.classList.add('hidden');
  }
  renderTable();
}

async function loadRosterAndLegend(){
  const [savedRoster, savedLegend, savedReq] = await Promise.all([
    storageGetJSON(STORE_PREFIX + ':roster'),
    storageGetJSON(STORE_PREFIX + ':legend'),
    storageGetJSON(STORE_PREFIX + ':requirements'),
  ]);
  roster = savedRoster || normalizeRosterFromNames(DEFAULT_ROSTER);
  roster.forEach(g => g.employees.forEach(e => { if(!e.pref) e.pref = 'either'; if(!e.areaPref) e.areaPref = 'either'; if(!e.blockedDays) e.blockedDays = []; if(!e.recurringShifts) e.recurringShifts = {}; if(e.hourTarget === undefined) e.hourTarget = null; if(e.preferredDayOff === undefined) e.preferredDayOff = null; }));
  legend = savedLegend || DEFAULT_LEGEND.map(x => ({...x}));
  legend.forEach(l => { if(!l.period) l.period = 'either'; if(!l.area) l.area = 'either'; if(l.defaultTime == null) l.defaultTime = ''; });
  requirements = savedReq || {...DEFAULT_REQUIREMENTS};
  // migrate old formats: single number -> {day,night}; single day/night number -> per-weekday array of 7
  Object.keys(requirements).forEach(k => {
    if(typeof requirements[k] === 'number'){
      requirements[k] = {day: requirements[k], night: requirements[k]};
    }
    const req = requirements[k];
    if(typeof req.day === 'number' || req.day == null) req.day = new Array(7).fill(req.day || 0);
    if(typeof req.night === 'number' || req.night == null) req.night = new Array(7).fill(req.night || 0);
    if(!req.dayType) req.dayType = defaultTypeForPeriod('day');
    if(!req.nightType) req.nightType = defaultTypeForPeriod('night');
  });
}

async function saveRequirements(){ await storageSetJSON(STORE_PREFIX + ':requirements', requirements); }

function defaultTypeForPeriod(period){
  const found = legend.find(l => l.period === period && l.key !== 'OFF');
  if(found) return found.key;
  const anyReal = legend.find(l => l.key !== 'OFF');
  return anyReal ? anyReal.key : legend[0].key;
}

async function saveRoster(){ await storageSetJSON(STORE_PREFIX + ':roster', roster); }

async function saveRosterAsTemplate(){
  if(!confirm('Save your current roster as the template to load up each time? This replaces any template saved before.')) return;
  const ok = await storageSetJSON(STORE_PREFIX + ':roster-template', roster);
  setStatus(ok ? 'Saved this roster as your template.' : 'Could not save the template — try again.');
}

async function loadRosterTemplate(){
  const tmpl = await storageGetJSON(STORE_PREFIX + ':roster-template');
  if(!tmpl){ setStatus('No template saved yet — build a roster, then "Save roster as template."'); return; }
  if(!confirm('Load your saved template? This replaces the roster you\'re currently editing.')) return;
  roster = tmpl;
  await saveRoster();
  renderRosterEditor();
  renderTable();
  setStatus('Loaded your saved roster template.');
}
async function saveLegend(){ await storageSetJSON(STORE_PREFIX + ':legend', legend); }

function allEmployeesFlat(){
  const out = [];
  roster.forEach(g => g.employees.forEach(e => out.push({...e, group:g.name})));
  return out;
}

function legendByKey(key){
  return legend.find(l => l.key === key) || legend[0];
}

function cellKey(empId, dayIdx){ return empId + ':' + dayIdx; }

function getCell(empId, dayIdx){
  return cells[cellKey(empId,dayIdx)] || {type:'OFF', time:'', locked:false, needsFill:false};
}

function setCell(empId, dayIdx, patch){
  const cur = getCell(empId, dayIdx);
  cells[cellKey(empId,dayIdx)] = {...cur, ...patch};
}

function formatDateShort(d){
  return (d.getMonth()+1) + '/' + d.getDate();
}

function parseShiftHours(timeStr){
  if(!timeStr) return null;
  let parts = timeStr.split('/');
  if(parts.length !== 2) parts = timeStr.split('-');
  if(parts.length !== 2) return null;
  const re = /^\s*(\d{1,2})(?::(\d{2}))?\s*$/;
  const m1 = parts[0].match(re);
  const m2 = parts[1].match(re);
  if(!m1 || !m2) return null;

  function guessValue(h, mnt){
    h = parseInt(h,10);
    mnt = mnt ? parseInt(mnt,10) : 0;
    if(h === 12) return 12 + mnt/60;
    if(h >= 5 && h <= 11) return h + mnt/60;
    return h + 12 + mnt/60; // 1-4 assumed PM
  }

  let start = guessValue(m1[1], m1[2]);
  let end = guessValue(m2[1], m2[2]);
  if(end <= start) end += 12;
  const hours = end - start;
  if(hours <= 0 || hours > 16) return null;
  return hours;
}

function computeEmployeeWeeklyHours(empId){
  let total = 0;
  let anyUnparsed = false;
  for(let d=0; d<numDays; d++){
    const c = getCell(empId, d);
    if(c.type === 'OFF') continue;
    const h = parseShiftHours(c.time);
    if(h === null){
      if(c.time) anyUnparsed = true;
    } else {
      total += h;
    }
  }
  return {total, anyUnparsed};
}

function updateRowTotal(empId){
  const el = document.getElementById('total-' + empId);
  if(!el) return;
  formatTotalCell(el, empId);
}

function formatTotalCell(el, empId){
  const emp = allEmployeesFlat().find(e => e.id === empId);
  const {total, anyUnparsed} = computeEmployeeWeeklyHours(empId);
  const rounded = Math.round(total*100)/100;
  el.innerHTML = '';
  el.style.color = '';

  el.appendChild(document.createTextNode(String(rounded)));

  if(emp && emp.hourTarget != null && emp.hourTarget > 0){
    const targetSpan = document.createElement('span');
    targetSpan.className = 'no-print';
    targetSpan.textContent = ' / ' + emp.hourTarget;
    el.appendChild(targetSpan);
    if(total > emp.hourTarget) el.style.color = '#b03030';
    else if(total >= emp.hourTarget - 2) el.style.color = '#2e9e44';
    else el.style.color = '#888';
  }
  if(anyUnparsed) el.appendChild(document.createTextNode(' +?'));
  el.title = anyUnparsed ? 'Some times couldn\'t be read — check formatting like 9:00/3:00' : '';
}

function getWeekDates(){
  const startVal = document.getElementById('weekStart').value;
  const start = startVal ? new Date(startVal + 'T00:00:00') : new Date();
  const days = [];
  for(let i=0;i<numDays;i++){
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    days.push(d);
  }
  return days;
}

    bar.appendChild(el);
  });
}

function renderTable(){
  numDays = document.getElementById('includeSunday').checked ? 7 : 6;
  const days = getWeekDates();
  const table = document.getElementById('schedTable');
  table.innerHTML = '';

  const thead = document.createElement('thead');
  const trDate = document.createElement('tr');
  trDate.innerHTML = '<th>DATE</th>' + days.map(d => `<th>${formatDateShort(d)}</th>`).join('') + '<th>Total</th>';
  const trDay = document.createElement('tr');
  trDay.innerHTML = '<th></th>' + days.map((d,i) => `<th>${DAY_NAMES[i]}</th>`).join('') + '<th>Hrs</th>';
  thead.appendChild(trDate);
  thead.appendChild(trDay);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');

  roster.forEach((group, gi) => {
    const labelRow = document.createElement('tr');
    labelRow.className = 'group-label';
    const td = document.createElement('td');
    td.colSpan = numDays + 2;
    td.textContent = group.name;
    labelRow.appendChild(td);
    tbody.appendChild(labelRow);

    group.employees.forEach((emp, idx) => {
      const tr = document.createElement('tr');
      const nameTd = document.createElement('td');
      nameTd.className = 'namecell';
      nameTd.style.color = idx % 2 === 0 ? '#111' : '#b03030';
      nameTd.textContent = emp.name;
      tr.appendChild(nameTd);

      for(let d=0; d<numDays; d++){
        const td = document.createElement('td');
        td.className = 'cell';
        if((emp.blockedDays || []).includes(d)) td.classList.add('blocked-day');

        const toggles = document.createElement('div');
        toggles.className = 'celltoggles';
        const lockBtn = document.createElement('button');
        lockBtn.type = 'button';
        lockBtn.textContent = '🔒';
        const flagBtn = document.createElement('button');
        flagBtn.type = 'button';
        flagBtn.textContent = '🚩';
        toggles.appendChild(lockBtn);
        toggles.appendChild(flagBtn);

        const sel = document.createElement('select');
        sel.className = 'shift-select';
        legend.forEach(l => {
          const opt = document.createElement('option');
          opt.value = l.key;
          opt.textContent = l.label;
          sel.appendChild(opt);
        });
        const timeInput = document.createElement('input');
        timeInput.type = 'text';
        timeInput.className = 'shift-time';
        timeInput.placeholder = '9:00/3:00';

        const current = getCell(emp.id, d);
        sel.value = current.type;
        timeInput.value = current.time;
        applyCellColor(sel, timeInput, current.type);

        function refreshCellUI(){
          const c = getCell(emp.id, d);
          td.classList.toggle('locked', !!c.locked);
          td.classList.toggle('needsfill', !!c.needsFill);
          lockBtn.classList.toggle('on', !!c.locked);
          flagBtn.classList.toggle('on', !!c.needsFill);
          sel.disabled = !!c.locked || !isAdmin;
          timeInput.disabled = !!c.locked || !isAdmin;
          lockBtn.disabled = !isAdmin;
          flagBtn.disabled = !isAdmin;
        }

        if(current.type === 'OFF'){
          timeInput.value = '';
          timeInput.classList.add('hidden');
        }
        refreshCellUI();

        sel.addEventListener('change', () => {
          const t = sel.value;
          if(t === 'OFF'){
            timeInput.value = '';
            timeInput.classList.add('hidden');
          } else {
            timeInput.classList.remove('hidden');
            const l = legendByKey(t);
            if(l.defaultTime) timeInput.value = l.defaultTime;
          }
          applyCellColor(sel, timeInput, t);
          setCell(emp.id, d, {type:t, time:timeInput.value});
          updateRowTotal(emp.id);
        });
        timeInput.addEventListener('input', () => {
          setCell(emp.id, d, {time:timeInput.value});
          updateRowTotal(emp.id);
        });
        lockBtn.addEventListener('click', () => {
          const c = getCell(emp.id, d);
          setCell(emp.id, d, {locked: !c.locked});
          refreshCellUI();
        });
        flagBtn.addEventListener('click', () => {
          const c = getCell(emp.id, d);
          setCell(emp.id, d, {needsFill: !c.needsFill});
          refreshCellUI();
        });

        td.appendChild(toggles);
        td.appendChild(sel);
        td.appendChild(timeInput);
        tr.appendChild(td);
      }

      const totalTd = document.createElement('td');
      totalTd.className = 'totalcell';
      totalTd.id = 'total-' + emp.id;
      formatTotalCell(totalTd, emp.id);
      tr.appendChild(totalTd);
      tbody.appendChild(tr);
    });

    if(gi < roster.length - 1){
      const divider = document.createElement('tr');
      divider.className = 'group-divider';
      const dtd = document.createElement('td');
      dtd.colSpan = numDays + 2;
      divider.appendChild(dtd);
      tbody.appendChild(divider);
    }
  });

  table.appendChild(tbody);
}

function applyCellColor(sel, timeInput, typeKey){
  const l = legendByKey(typeKey);
  sel.style.background = l.color;
  timeInput.style.background = l.color === '#ffffff' ? '#fff' : l.color;
}

  });

function renderRequirementsEditor(){
  const container = document.getElementById('reqEditor');
  container.innerHTML = '<h3>Staffing needed per day</h3><p style="font-size:12px;color:#555;margin-top:0;">How many people from each group should be working, set separately for each day of the week, split by day-shift and night-shift. Generate picks OFF, unlocked people — preferring whoever\'s Day/Night preference matches (set in "Edit roster") — and fills in the shift type below for them.</p>';
  const dayAbbrevsReq = ['Mo','Tu','We','Th','Fr','Sa','Su'];

  roster.forEach(group => {
    if(!requirements[group.name]) requirements[group.name] = {day:new Array(7).fill(0), night:new Array(7).fill(0), dayType:'', nightType:''};
    const req = requirements[group.name];
    if(typeof req.day === 'number' || req.day == null) req.day = new Array(7).fill(req.day || 0);
    if(typeof req.night === 'number' || req.night == null) req.night = new Array(7).fill(req.night || 0);
    if(!req.dayType) req.dayType = defaultTypeForPeriod('day');
    if(!req.nightType) req.nightType = defaultTypeForPeriod('night');

    const block = document.createElement('div');
    block.className = 'group-block';
    const title = document.createElement('div');
    title.style.fontWeight = 'bold';
    title.textContent = group.name;
    block.appendChild(title);

    function buildPeriodRow(label, countsArr, typeSelectValue, onTypeChange){
      const typeLine = document.createElement('div');
      typeLine.className = 'emp-line';
      const typeLabel = document.createElement('label');
      typeLabel.textContent = label + ' shift type:';
      typeLabel.style.minWidth = '110px';
      const typeSelect = document.createElement('select');
      typeSelect.style.width = '120px';
      legend.filter(l => l.key !== 'OFF').forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.key;
        opt.textContent = l.label;
        typeSelect.appendChild(opt);
      });
      typeSelect.value = typeSelectValue;
      typeSelect.addEventListener('change', () => { onTypeChange(typeSelect.value); saveRequirements(); });
      typeLine.appendChild(typeLabel);
      typeLine.appendChild(typeSelect);

      const countsLine = document.createElement('div');
      countsLine.className = 'emp-line';
      const countsLabel = document.createElement('label');
      countsLabel.textContent = label + ' count:';
      countsLabel.style.minWidth = '110px';
      countsLine.appendChild(countsLabel);
      dayAbbrevsReq.forEach((abbr, dIdx) => {
        const wrap = document.createElement('span');
        wrap.style.display = 'inline-flex';
        wrap.style.flexDirection = 'column';
        wrap.style.alignItems = 'center';
        wrap.style.fontSize = '10px';
        const dLabel = document.createElement('span');
        dLabel.textContent = abbr;
        dLabel.style.color = '#888';
        const dInput = document.createElement('input');
        dInput.type = 'text';
        dInput.inputMode = 'numeric';
        dInput.style.width = '34px';
        dInput.style.textAlign = 'center';
        dInput.value = countsArr[dIdx];
        dInput.addEventListener('change', () => {
          const v = parseInt(dInput.value, 10);
          countsArr[dIdx] = isNaN(v) ? 0 : v;
          saveRequirements();
        });
        wrap.appendChild(dLabel);
        wrap.appendChild(dInput);
        countsLine.appendChild(wrap);
      });

      return [typeLine, countsLine];
    }

    buildPeriodRow('Day', req.day, req.dayType, v => { req.dayType = v; }).forEach(el => block.appendChild(el));
    buildPeriodRow('Night', req.night, req.nightType, v => { req.nightType = v; }).forEach(el => block.appendChild(el));

    container.appendChild(block);
  });
}

function defaultMonday(){
  const d = new Date();
  const day = d.getDay();
  const diff = (day === 0) ? 1 : (day === 1 ? 0 : 8 - day);
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0,10);
}

async function currentWeekKey(){
  const startVal = document.getElementById('weekStart').value;
  return STORE_PREFIX + ':week:' + startVal;
}

async function saveCurrentWeek(){
  const key = await currentWeekKey();
  const label = document.getElementById('weekLabel').value;
  const payload = { label, numDays, cells };
  const ok = await storageSetJSON(key, payload);
  if(ok){
    const list = await storageGetJSON(STORE_PREFIX + ':weeklist') || [];
    if(!list.includes(key)) list.push(key);
    await storageSetJSON(STORE_PREFIX + ':weeklist', list);
    setStatus('Saved week starting ' + document.getElementById('weekStart').value);
  } else {
    setStatus('Could not save — try again.');
  }
}

async function loadWeek(key){
  const data = await storageGetJSON(key);
  if(data){
    cells = data.cells || {};
    document.getElementById('weekLabel').value = data.label || '';
    renderTable();
    setStatus('Loaded ' + key.split(':').pop());
  }
}

async function duplicateLastWeek(){
  const list = await storageGetJSON(STORE_PREFIX + ':weeklist') || [];
  if(list.length === 0){ setStatus('No saved weeks yet to duplicate.'); return; }
  const lastKey = list[list.length - 1];
  const data = await storageGetJSON(lastKey);
  if(data){
    cells = data.cells || {};
    renderTable();
    setStatus('Copied shifts from previous saved week — adjust as needed, then Save.');
  }
}

async function promptLoadWeek(){
  const list = await storageGetJSON(STORE_PREFIX + ':weeklist') || [];
  if(list.length === 0){ setStatus('No saved weeks yet.'); return; }
  const labels = list.map(k => k.split(':').pop());
  const choice = prompt('Load which week? Enter the start date:\n' + labels.join('\n'), labels[labels.length-1]);
  if(choice){
    const key = STORE_PREFIX + ':week:' + choice;
    await loadWeek(key);
  }
}

function clearWeek(){
  cells = {};
  renderTable();
}

function runGenerate(){
  const panel = document.getElementById('generatePanel');
  const days = getWeekDates();
  const warnings = [];

  // Self-heal: clear any leftover "assigned OFF + flagged" cells from before this fix existed
  Object.keys(cells).forEach(k => {
    const c = cells[k];
    if(c.type === 'OFF' && c.needsFill && !c.locked){
      c.needsFill = false;
    }
  });

  // Track each employee's working-day count across the whole week so nobody ends up with zero days off
  const workingDaysCount = {};
  const workingHoursTotal = {};
  allEmployeesFlat().forEach(emp => {
    let count = 0;
    for(let d=0; d<numDays; d++){
      if(getCell(emp.id, d).type !== 'OFF') count++;
    }
    workingDaysCount[emp.id] = count;
    workingHoursTotal[emp.id] = computeEmployeeWeeklyHours(emp.id).total;
  });

  // Apply each employee's recurring shift pattern first, before filling group coverage
  allEmployeesFlat().forEach(emp => {
    const pattern = emp.recurringShifts || {};
    Object.keys(pattern).forEach(dStr => {
      const d = parseInt(dStr, 10);
      if(d >= numDays) return; // this week doesn't include that day (e.g. Sunday hidden)
      if((emp.blockedDays || []).includes(d)) return; // blocked day always wins
      if(workingDaysCount[emp.id] >= numDays - 1) return; // keep at least one day off
      const c = getCell(emp.id, d);
      if(c.type !== 'OFF' || c.locked) return; // don't override something already set or locked
      const typeKey = pattern[d];
      const l = legendByKey(typeKey);
      const shiftHours = parseShiftHours(l.defaultTime) || 0;
      if(emp.hourTarget != null && emp.hourTarget > 0 && (workingHoursTotal[emp.id] + shiftHours) > emp.hourTarget){
        warnings.push(`${DAY_NAMES[d]} ${formatDateShort(days[d])} — ${emp.name}'s usual ${l.label} shift was skipped, would go over their ${emp.hourTarget}hr target`);
        return;
      }
      setCell(emp.id, d, {type: typeKey, time: l.defaultTime || '', needsFill:true});
      workingDaysCount[emp.id] = (workingDaysCount[emp.id] || 0) + 1;
      workingHoursTotal[emp.id] = (workingHoursTotal[emp.id] || 0) + shiftHours;
    });
  });

  function periodOfCell(c){
    if(c.type === 'OFF') return null;
    const l = legendByKey(c.type);
    return l.period || 'either';
  }

  function pickCandidates(group, d, period, area, count, alreadyTaken, shiftHours){
    const pool = group.employees.filter(emp => {
      if(alreadyTaken.has(emp.id)) return false;
      if((emp.blockedDays || []).includes(d)) return false;
      if(workingDaysCount[emp.id] >= numDays - 1) return false; // keep at least one day off
      if(emp.hourTarget != null && emp.hourTarget > 0 && (workingHoursTotal[emp.id] + shiftHours) > emp.hourTarget) return false;
      const c = getCell(emp.id,d);
      return c.type === 'OFF' && !c.locked;
    });
    // prefer matching preference, then 'either'-preference people, then the opposite as last resort — combine period + area
    const rank = (val, target) => val === target ? 0 : (val === 'either' ? 1 : 2);
    // balance the week first — prefer whoever has worked fewer days so far — then break ties by preference match,
    // and nudge away from anyone's preferred day off (soft — still usable if nobody else is available)
    const score = emp => (workingDaysCount[emp.id] || 0) * 10 + rank(emp.pref || 'either', period) + rank(emp.areaPref || 'either', area) + (emp.preferredDayOff === d ? 5 : 0);
    pool.sort((a,b) => score(a) - score(b));
    return pool.slice(0, count);
  }

  // Step 1: for each day/group, assign enough OFF+unlocked people to hit day & night quotas
  for(let d=0; d<numDays; d++){
    roster.forEach(group => {
      const req = requirements[group.name] || {day:new Array(7).fill(0), night:new Array(7).fill(0), dayType:'OTH', nightType:'OTH'};
      const takenToday = new Set();

      ['day','night'].forEach(period => {
        const periodArr = req[period];
        const required = (Array.isArray(periodArr) ? periodArr[d] : periodArr) || 0;
        if(required <= 0) return;
        const filledCount = group.employees.filter(emp => {
          const c = getCell(emp.id,d);
          const p = periodOfCell(c);
          return p === period || p === 'either';
        }).length;
        const shortfall = required - filledCount;
        if(shortfall <= 0) return;

        let assignType = period === 'day' ? req.dayType : req.nightType;
        if(!assignType || assignType === 'OFF') assignType = defaultTypeForPeriod(period);
        const assignArea = legendByKey(assignType).area || 'either';
        const assignTime = legendByKey(assignType).defaultTime || '';
        const assignHours = parseShiftHours(assignTime) || 0;

        const picked = pickCandidates(group, d, period, assignArea, shortfall, takenToday, assignHours);
        picked.forEach(emp => {
          setCell(emp.id, d, {type: assignType, time: assignTime, needsFill:true});
          takenToday.add(emp.id);
          workingDaysCount[emp.id] = (workingDaysCount[emp.id] || 0) + 1;
          workingHoursTotal[emp.id] = (workingHoursTotal[emp.id] || 0) + assignHours;
        });

        if(picked.length < shortfall){
          warnings.push(`${DAY_NAMES[d]} ${formatDateShort(days[d])} — ${group.name} (${period}) still short ${shortfall - picked.length} (no one available)`);
        }
      });
    });
  }

  renderTable();

  // Step 2: list every flagged, unlocked shift — old manual flags plus the ones just added
  const flat = allEmployeesFlat();
  const openItems = [];
  flat.forEach(emp => {
    for(let d=0; d<numDays; d++){
      const c = getCell(emp.id, d);
      if(c.needsFill && !c.locked){
        const typeLabel = legendByKey(c.type).label;
        openItems.push({name:emp.name, group:emp.group, day:DAY_NAMES[d], date:formatDateShort(days[d]), pref:emp.pref, areaPref:emp.areaPref, typeLabel});
      }
    }
  });

  let html = '';
  if(openItems.length === 0 && warnings.length === 0){
    html = '<h3>Generate finished</h3><p>Coverage requirements are already met — nothing to assign.</p>';
  } else {
    const parts = [];
    if(openItems.length) parts.push(`${openItems.length} shift${openItems.length === 1 ? '' : 's'} assigned`);
    if(warnings.length) parts.push(`${warnings.length} coverage gap${warnings.length === 1 ? '' : 's'}`);
    html += `<h3>Generate finished — ${parts.join(', ')}</h3>`;

    if(openItems.length){
      const items = openItems.map(o => {
        const prefs = [];
        if(o.pref && o.pref !== 'either') prefs.push(o.pref);
        if(o.areaPref && o.areaPref !== 'either') prefs.push(o.areaPref);
        const prefText = prefs.length ? `, prefers ${prefs.join('/')}` : '';
        return `<li><strong>${o.day} ${o.date}</strong> — ${o.name} assigned ${o.typeLabel} (${o.group}${prefText}) — add exact time</li>`;
      }).join('');
      html += `<details><summary>Shifts assigned — still need exact times (${openItems.length})</summary><ul>${items}</ul></details>`;
    }
    if(warnings.length){
      html += `<details><summary style="color:#b03030;">Coverage gaps — no one available (${warnings.length})</summary><ul>${warnings.map(w=>`<li>${w}</li>`).join('')}</ul></details>`;
    }
  }
  panel.innerHTML = html;
  panel.classList.remove('hidden');
  setStatus('Generated — open shifts assigned by preference, locked cells untouched. Fill in exact times.');
}

function toggle(id){
  const el = document.getElementById(id);
  el.classList.toggle('hidden');
}

async function init(){
  try{
    setStatus('Loading your saved roster...');

    const savedUrl = lsGet(CFG_URL_KEY);
    const savedKey = lsGet(CFG_KEY_KEY);
    const skipped = lsGet('mfcsched_cloud_skip');
    if(!savedUrl && !skipped){
      document.getElementById('cloudSetup').classList.remove('hidden');
    }

    await initCloud();
    await loadRosterAndLegend();
    document.getElementById('weekStart').value = defaultMonday();
    renderLegendBar();
    renderTable();
    setStatus(cloudConfigured ? 'Connected — this schedule is now live-shared.' : 'Ready. Set up your roster and shift types once — they\'ll be remembered for future weeks.');
  }catch(e){
    console.error('init failed', e);
    setStatus('Something went wrong loading the app: ' + e.message);
    ['editToolbar','editToolbar-schedule','editToolbar-roster','editToolbar-sharing'].forEach(id => document.getElementById(id).classList.remove('hidden'));
    document.getElementById('viewerToolbar').classList.add('hidden');
  }

  document.getElementById('weekStart').addEventListener('change', renderTable);
  document.getElementById('includeSunday').addEventListener('change', renderTable);
  document.getElementById('btnNewWeek').addEventListener('click', () => { clearWeek(); setStatus('Blank week ready.'); });
  document.getElementById('btnDuplicate').addEventListener('click', duplicateLastWeek);
  document.getElementById('btnSave').addEventListener('click', saveCurrentWeek);
  document.getElementById('btnLoad').addEventListener('click', promptLoadWeek);
  document.getElementById('btnPrint').addEventListener('click', () => window.print());
  document.getElementById('btnPrintViewer').addEventListener('click', () => window.print());
  document.getElementById('btnGenerate').addEventListener('click', runGenerate);
  document.getElementById('btnToggleRoster').addEventListener('click', () => { renderRosterEditor(); toggle('rosterEditor'); });
  document.getElementById('btnToggleLegend').addEventListener('click', () => { renderLegendEditor(); toggle('legendEditor'); });
  document.getElementById('btnResetRoster').addEventListener('click', async () => {
    if(!confirm('This replaces your saved roster with the current default groups (Front Counter, Shift Leads: Alex + Khrystal, Kitchen). Continue?')) return;
    roster = normalizeRosterFromNames(DEFAULT_ROSTER);
    await saveRoster();
    renderTable();
    setStatus('Roster reset to default.');
  });
  document.getElementById('btnToggleReq').addEventListener('click', () => { renderRequirementsEditor(); toggle('reqEditor'); });
  document.getElementById('btnResetReq').addEventListener('click', async () => {
    if(!confirm('This clears the staffing counts back to 0 for every group, so Generate won\'t auto-assign anyone until you set new numbers. Continue?')) return;
    requirements = {};
    roster.forEach(g => { requirements[g.name] = {day:new Array(7).fill(0), night:new Array(7).fill(0), dayType: defaultTypeForPeriod('day'), nightType: defaultTypeForPeriod('night')}; });
    await saveRequirements();
    setStatus('Staffing needs reset to 0 — Generate won\'t assign anyone until you set counts again.');
  });

  document.getElementById('btnOpenCloudSetup').addEventListener('click', () => {
    document.getElementById('cfgUrl').value = lsGet(CFG_URL_KEY) || '';
    document.getElementById('cfgKey').value = lsGet(CFG_KEY_KEY) || '';
    document.getElementById('cloudSetup').classList.remove('hidden');
  });
  document.getElementById('btnSkipCloud').addEventListener('click', () => {
    lsSet('mfcsched_cloud_skip', '1');
    document.getElementById('cloudSetup').classList.add('hidden');
  });
  document.getElementById('btnSaveCloudCfg').addEventListener('click', async () => {
    const url = document.getElementById('cfgUrl').value.trim();
    const key = document.getElementById('cfgKey').value.trim();
    if(!url || !key){ setStatus('Enter both the Project URL and the anon key.'); return; }
    lsSet(CFG_URL_KEY, url);
    lsSet(CFG_KEY_KEY, key);
    lsRemove('mfcsched_cloud_skip');
    setStatus('Connecting...');
    location.reload();
  });

  document.getElementById('btnAdminLogin').addEventListener('click', async () => {
    if(!cloudConfigured){ setStatus('Set up live sharing first.'); return; }
    const email = prompt('Admin email:');
    if(!email) return;
    const password = prompt('Admin password:');
    if(!password) return;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ setStatus('Login failed: ' + error.message); return; }
    isAdmin = true;
    applyAdminUI();
    setStatus('Logged in as admin.');
  });
  document.getElementById('btnAdminLogout').addEventListener('click', async () => {
    if(sb) await sb.auth.signOut();
    isAdmin = false;
    applyAdminUI();
    setStatus('Logged out — viewing as employee.');
  });

  document.getElementById('btnTextGroup').addEventListener('click', () => {
    const numbers = allEmployeesFlat()
      .map(e => (e.phone || '').replace(/[^\d+]/g, ''))
      .filter(p => p.length >= 7);

    const weekLabel = document.getElementById('weekLabel').value || document.getElementById('weekStart').value;
    let publicUrl = lsGet('mfcsched_public_url');
    if(!publicUrl){
      publicUrl = prompt('What web address should employees use to view the schedule? (leave blank to skip a link)') || '';
      if(publicUrl) lsSet('mfcsched_public_url', publicUrl);
    }

    let body = `New schedule posted for ${weekLabel}.`;
    if(publicUrl) body += ` View it here: ${publicUrl}`;

    if(numbers.length === 0){
      alert('No phone numbers are saved yet. Add them in "Edit roster," or this will just open a blank text for you to add people to manually.');
    }
    const sep = numbers.length ? '&' : '?';
    const smsUrl = `sms:${numbers.join(',')}${sep}body=${encodeURIComponent(body)}`;
    window.location.href = smsUrl;
  });

  document.getElementById('btnSaveToFile').addEventListener('click', saveAllToLocalFile);
  document.getElementById('btnSaveRosterTemplate').addEventListener('click', saveRosterAsTemplate);
  document.getElementById('btnLoadRosterTemplate').addEventListener('click', loadRosterTemplate);
  document.getElementById('btnLoadFromFile').addEventListener('click', loadAllFromLocalFile);
  document.getElementById('fileImportInput').addEventListener('change', async (ev) => {
    const file = ev.target.files[0];
    if(!file) return;
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      await restoreAllAppData(data);
      await loadRosterAndLegend();
      renderLegendBar();
      renderTable();
      setStatus('Loaded data from ' + file.name + '.');
    }catch(e){
      console.error('file import failed', e);
      setStatus('Could not read that file: ' + e.message);
    }
    ev.target.value = '';
  });
}

init();
</script>
</body>
</html>
